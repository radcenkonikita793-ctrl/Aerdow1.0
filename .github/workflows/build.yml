name: Ultimate iOS IPA Build (Godot 4.3 + Xcode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable"

jobs:
  build-ios:
    name: Build Unsigned IPA for ESign
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      # 1. Клонирование репозитория
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Активация инструментария Xcode 15
      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      # 3. Скачивание Godot Engine 4.3 и официальных шаблонов экспорта
      - name: Download & Install Godot Engine + Export Templates
        run: |
          set -euxo pipefail
          echo "Скачивание Godot Engine..."
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/Godot.app

          echo "Установка шаблонов экспорта..."
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/ios.zip "$TEMPLATE_DIR/ios.zip"
          rm -rf godot.zip templates.tpz templates/

      # 4. Распаковка архивов проекта и выдача прав
      - name: Unpack Workspace & Set Permissions
        run: |
          set -euxo pipefail
          mkdir -p workspace

          for archive in *.zip; do
            if [ -f "$archive" ]; then
              unzip -qo "$archive" -d workspace/
            fi
          done

          ROOT_DIR=$(find workspace -name "project.godot" -exec dirname {} \;)
          if [ -n "$ROOT_DIR" ] && [ "$ROOT_DIR" != "workspace" ]; then
            rsync -a "$ROOT_DIR/" workspace/
            rm -rf "$ROOT_DIR"
          fi

          # Полный сброс кэша и выдача прав на запись
          rm -rf workspace/.godot
          chmod -R 777 workspace

      # 5. Предварительный импорт ресурсов (убирает ошибки filesystem_cache8)
      - name: Import Godot Project Resources
        run: |
          set -euxo pipefail
          /Applications/Godot.app/Contents/MacOS/Godot --path workspace --headless --editor --quit || true
          chmod -R 777 workspace

      # 6. Генерация конфигурации пресета под Xcode
      - name: Generate Export Presets
        run: |
          set -euxo pipefail
          cat << 'EOF' > workspace/export_presets.cfg
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/Aerdrom.xcodeproj"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_script=false

          [preset.0.options]
          application/bundle_identifier="com.biteraplaystaz.aerdrom"
          application/signature="aerd"
          application/short_version="1.0"
          application/version="1.0"
          application/app_store_team_id="1234567890"
          architectures/arm64=true
          codesign/identity=""
          codesign/entitlements=""
          provisioning_profile=""
          privacy/camera_usage_description="Camera access"
          privacy/microphone_usage_description="Microphone access"
          privacy/photo_library_usage_description="Photo library access"
          EOF

      # 7. Экспорт из Godot в проект Xcode (.xcodeproj)
      - name: Export Xcode Project via Godot
        run: |
          set -euxo pipefail
          mkdir -p workspace/build/ios
          chmod -R 777 workspace/build

          /Applications/Godot.app/Contents/MacOS/Godot --path workspace \
            --headless \
            --export-release "iOS" "$PWD/workspace/build/ios/Aerdrom.xcodeproj"

      # 8. Компиляция приложения с помощью Xcode CLI и запаковка под ESign
      - name: Compile Unsigned IPA via Xcode
        run: |
          set -euxo pipefail
          cd workspace/build/ios

          echo "Сборка архива через xcodebuild..."
          xcodebuild archive \
            -project Aerdrom.xcodeproj \
            -scheme Aerdrom \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Aerdrom.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "Создание структуры Payload и упаковка в .ipa..."
          mkdir -p Payload
          cp -r build/Aerdrom.xcarchive/Products/Applications/*.app Payload/
          zip -r Aerdrom.ipa Payload/

          ls -lh Aerdrom.ipa

      # 9. Сохранение финального неподписанного .ipa
      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aerdrom-iOS-IPA
          path: workspace/build/ios/Aerdrom.ipa
