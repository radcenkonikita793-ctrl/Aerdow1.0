name: Build Aerdrom iOS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Parts
        run: |
          echo "Распаковываем все части проекта в единую папку..."
          mkdir -p extracted_project
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Распаковка архива: $f"
              unzip -q "$f" -d extracted_project/
            fi
          done
          # Убираем лишние вложенные папки, если они дублируют корень
          if [ -d "extracted_project/aerdw1.0" ]; then
            mv extracted_project/aerdw1.0/* extracted_project/
          fi
          rm -rf extracted_project/.godot

      - name: Verify Project Files
        run: |
          echo "Проверяем наличие главного файла проекта:"
          find extracted_project -name "project.godot"
