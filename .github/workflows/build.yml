name: Fixed iOS IPA Build (Godot Engine)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable"

jobs:
  build-ios:
    name: Build Unsigned IPA for ESign
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download & Install Godot Engine + Templates
        run: |
          set -euxo pipefail
          echo "Скачиваем Godot Engine ${GODOT_VERSION}..."
          
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/Godot.app

          echo "Скачиваем шаблоны экспорта..."
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/ios.zip "$TEMPLATE_DIR/ios.zip"
          rm -rf godot.zip templates.tpz templates/

      - name: Unpack Project Workspace
        run: |
          set -euxo pipefail
          mkdir -p workspace

          for archive in *.zip; do
            if [ -f "$archive" ]; then
              unzip -qo "$archive" -d workspace/
            fi
          done

          ROOT_DIR=$(find workspace -name "project.godot" -exec dirname {} \;)
          if [ -n "$ROOT_DIR" ] && [ "$ROOT_DIR" != "workspace" ]; then
            rsync -a "$ROOT_DIR/" workspace/
            rm -rf "$ROOT_DIR"
          fi
          rm -rf workspace/.godot

      - name: Generate Export Preset
        run: |
          set -euxo pipefail
          cat << 'EOF' > workspace/export_presets.cfg
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/Aerdrom.ipa"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_script=false

          [preset.0.options]
          application/bundle_identifier="com.aerdrom.game"
          application/signature="aerd"
          application/short_version="1.0"
          application/version="1.0"
          architectures/arm64=true
          codesign/identity=""
          codesign/entitlements=""
          provisioning_profile=""
          privacy/camera_usage_description="Camera access"
          privacy/microphone_usage_description="Microphone access"
          privacy/photo_library_usage_description="Photo library access"
          EOF

      - name: Export Project via Godot
        run: |
          set -euxo pipefail
          mkdir -p workspace/build/ios
          mkdir -p godot_cache_dir

          /Applications/Godot.app/Contents/MacOS/Godot --path workspace \
            --editor-setting-path "$PWD/godot_cache_dir" \
            --headless \
            --export-release "iOS" "$PWD/workspace/build/ios/Aerdrom.ipa"

          ls -lh workspace/build/ios/Aerdrom.ipa

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aerdrom-iOS-IPA
          path: workspace/build/ios/Aerdrom.ipa
