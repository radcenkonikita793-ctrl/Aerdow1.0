name: Build Aerdrom iOS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Parts
        run: |
          echo "Распаковываем все части проекта в единую папку..."
          mkdir -p extracted_project
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Распаковка архива: $f"
              unzip -q "$f" -d extracted_project/
            fi
          done
          if [ -d "extracted_project/aerdw1.0" ]; then
            mv extracted_project/aerdw1.0/* extracted_project/
          fi
          rm -rf extracted_project/.godot

      - name: Download and Setup Godot
        run: |
          echo "Скачиваем Godot Engine для macOS..."
          GODOT_VERSION="4.3-stable"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/Godot.app

      - name: Export iOS Project
        run: |
          cd extracted_project
          mkdir -p build/ios
          echo "Экспортируем проект через Godot..."
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/aerdrom.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerdrom-ios-ipa
          path: extracted_project/build/ios/aerdrom.ipa
